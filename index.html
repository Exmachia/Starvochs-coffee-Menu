/* Starvochs Coffee is a fixed cream-and-pine brand identity taken straight from the
   physical poster — this page commits to that single light palette on purpose,
   regardless of OS/device theme, so it always reads as "the menu on the wall". */
:root, :root[data-theme="dark"], :root[data-theme="light"]{
  --bg:#F4E9CE; --surface:#FBF3DF; --surface-2:#F1E3BE; --border:#DCC793;
  --ink:#2A2118; --ink-muted:#6B5B44; --heading:#173625; --heading-soft:#2C5A42;
  --accent:#C22A2E; --accent-deep:#8F1D22; --accent-contrast:#FBF3DF;
  --chip-bg:#EFE2BE; --shadow:rgba(23,54,37,0.16); --backdrop:rgba(15,28,20,0.6);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Work Sans',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(circle at 1px 1px, rgba(0,0,0,0.035) 1px, transparent 0);
  background-size:22px 22px;
}
button{font-family:inherit;}
.page{max-width:1000px;margin:0 auto;padding:28px 18px 60px;}

/* ---------- Masthead ---------- */
.masthead{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-bottom:22px;}
.badge{
  width:clamp(72px,16vw,110px);height:clamp(72px,16vw,110px);flex:0 0 auto;
  display:block;object-fit:contain;
}
.brand-title{
  font-family:'Fredoka',sans-serif;font-weight:700;letter-spacing:1.5px;
  font-size:clamp(28px,6vw,44px);color:var(--heading);text-transform:uppercase;
  text-wrap:balance;margin:2px 0 0;
}
.brand-tagline{
  font-family:'Caveat',cursive;font-weight:700;color:var(--accent);
  font-size:clamp(20px,3.4vw,26px);transform:rotate(-2deg);margin:-4px 0 0;
}
.masthead-rule{width:100%;height:2px;background:var(--border);border:0;margin:0 0 18px;}

/* ---------- Tabs ---------- */
.tabbar-wrap{
  position:sticky;top:0;z-index:20;background:var(--bg);
  padding:6px 0 12px;margin:0 -18px 20px;
}
.tabbar-mask{
  padding:0 18px;overflow-x:auto;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%);
}
.tabbar-mask::-webkit-scrollbar{display:none;}
.tabbar{display:flex;gap:8px;width:max-content;padding:2px 2px;}
.tab{
  display:flex;align-items:center;gap:7px;white-space:nowrap;
  padding:10px 16px;border-radius:999px;border:1.5px solid var(--border);
  background:var(--surface);color:var(--heading-soft);
  font-weight:600;font-size:14px;cursor:pointer;transition:transform .15s ease, background .15s ease, color .15s ease, border-color .15s ease;
}
.tab svg{width:16px;height:16px;flex:0 0 auto;}
.tab:hover{transform:translateY(-1px);border-color:var(--heading-soft);}
.tab[aria-selected="true"]{
  background:var(--heading);color:var(--accent-contrast);border-color:var(--heading);
}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ---------- Panel heading ---------- */
.panel{display:none;scroll-margin-top:86px;}
.panel.active{display:block;animation:fade .25s ease;}
.panel.active + .panel.active{margin-top:38px;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.panel-head{display:flex;align-items:center;gap:9px;margin-bottom:14px;}
.panel-head svg{width:19px;height:19px;color:var(--accent);flex:0 0 auto;}
.panel-head h2{
  font-family:'Fredoka',sans-serif;font-weight:600;letter-spacing:.5px;
  font-size:19px;color:var(--heading);text-transform:uppercase;margin:0;
}
.panel-head-rule{flex:1;height:2px;background:var(--border);}

/* ---------- Featured grid ---------- */
.featured-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;margin-bottom:8px;}
.f-card{
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:14px 14px 16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px;
  transition:transform .15s ease, box-shadow .15s ease;
}
.f-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px -12px var(--shadow);}
.f-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.f-thumb{
  border-radius:14px;aspect-ratio:1/0.82;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 32%, var(--surface-2), var(--chip-bg));
}
.f-thumb svg{width:64%;height:64%;}
.f-name{font-family:'Fredoka',sans-serif;font-weight:600;font-size:15.5px;color:var(--heading);text-wrap:balance;}
.f-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.f-price{font-weight:700;color:var(--accent);font-size:14.5px;font-variant-numeric:tabular-nums;line-height:1.25;}
.f-hint{flex:0 0 auto;color:var(--ink-muted);display:flex;}
.f-hint svg{width:14px;height:14px;display:block;}

/* ---------- List rows ---------- */
.size-head{display:flex;align-items:baseline;padding:0 4px 6px;gap:10px;}
.size-head .sh-label{flex:1;}
.size-head span{
  font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--ink-muted);
  text-transform:uppercase;width:52px;text-align:right;
}
.list{border-top:1px solid var(--border);}
.row{
  display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--border);
  cursor:pointer;background:transparent;border-left:none;border-right:none;border-top:none;
  width:100%;text-align:left;transition:background .15s ease;
}
.row:hover, .row:focus-visible{background:var(--surface-2);}
.row:focus-visible{outline:none;}
.row-main{flex:1;min-width:0;}
.row-name{font-weight:600;font-size:15px;color:var(--ink);}
.row-note{
  display:block;font-style:italic;font-size:12px;color:var(--ink-muted);
  margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.row-prices{display:flex;gap:0;flex:0 0 auto;}
.row-prices b{
  width:52px;text-align:right;color:var(--accent);font-weight:700;font-size:14.5px;
  font-variant-numeric:tabular-nums;
}
.row-price-inline{color:var(--accent);font-weight:700;font-size:14.5px;white-space:nowrap;font-variant-numeric:tabular-nums;}
.row-chevron{color:var(--ink-muted);flex:0 0 auto;}
.row-chevron svg{width:14px;height:14px;display:block;}
.panel-footnote{margin:12px 4px 0;font-style:italic;font-size:12.5px;color:var(--ink-muted);}

/* ---------- Extras tab ---------- */
.extras-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
.extra-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:13px 15px;cursor:pointer;transition:transform .15s ease,background .15s ease;text-align:left;
}
.extra-row:hover{background:var(--surface-2);transform:translateY(-1px);}
.extra-row span:first-child{font-weight:600;font-size:14.5px;}
.extra-row b{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums;}

/* ---------- Footer ---------- */
.footer{margin-top:36px;padding-top:20px;border-top:2px solid var(--border);text-align:center;display:flex;flex-direction:column;gap:6px;}
.footer .script{font-family:'Caveat',cursive;font-weight:700;color:var(--accent);font-size:20px;}
.footer .thanks{font-weight:700;color:var(--heading);font-size:14px;}
.social-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin-top:6px;}
.social-link{
  display:inline-flex;align-items:center;gap:7px;color:var(--ink-muted);
  font-size:13px;font-weight:500;text-decoration:none;padding:7px 13px;
  border-radius:999px;border:1px solid transparent;transition:color .15s ease,border-color .15s ease,background .15s ease;
}
.social-link svg{width:15px;height:15px;flex:0 0 auto;}
.social-link:hover{color:var(--accent);background:var(--surface);border-color:var(--border);}
.social-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:var(--backdrop);display:flex;align-items:flex-end;justify-content:center;
  padding:0;z-index:100;opacity:0;pointer-events:none;transition:opacity .18s ease;
}
.modal-backdrop.open{opacity:1;pointer-events:auto;}
@media (min-width:640px){.modal-backdrop{align-items:center;padding:20px;}}
.modal{
  background:var(--surface);width:100%;max-width:440px;max-height:88vh;overflow-y:auto;
  border-radius:24px 24px 0 0;padding:26px 22px 28px;position:relative;
  box-shadow:0 -12px 40px -12px var(--shadow);
  transform:translateY(14px);transition:transform .2s ease;
}
@media (min-width:640px){.modal{border-radius:24px;transform:translateY(6px) scale(.98);}}
.modal-backdrop.open .modal{transform:translateY(0) scale(1);}
.modal-close{
  position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--border);background:var(--surface-2);color:var(--ink);
  font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.modal-close:hover{background:var(--chip-bg);}
.modal-icon{
  width:96px;height:96px;border-radius:50%;margin:0 auto 14px;
  background:radial-gradient(circle at 50% 32%, var(--surface-2), var(--chip-bg));
  display:flex;align-items:center;justify-content:center;
}
.modal-icon svg{width:62%;height:62%;}
.modal-icon.small svg{width:46%;height:46%;color:var(--accent);}
.modal-name{font-family:'Fredoka',sans-serif;font-weight:600;font-size:22px;color:var(--heading);text-align:center;text-wrap:balance;}
.modal-note{display:block;text-align:center;font-style:italic;font-size:13px;color:var(--ink-muted);margin-top:4px;}
.modal-price-row{display:flex;justify-content:center;gap:10px;margin-top:10px;}
.modal-price-pill{
  background:var(--chip-bg);color:var(--accent);font-weight:700;padding:5px 14px;border-radius:999px;
  font-size:14px;font-variant-numeric:tabular-nums;
}
.modal-divider{height:1px;background:var(--border);margin:18px 0;}
.modal-label{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-muted);margin-bottom:7px;}
.modal-desc{font-size:14.5px;line-height:1.55;color:var(--ink);margin:0 0 16px;}
.chip-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px;}
.chip{
  border:1px solid var(--border);background:var(--chip-bg);color:var(--ink);
  font-size:12.5px;font-weight:500;padding:6px 11px;border-radius:999px;
}
.chip.extra-chip{color:var(--heading-soft);font-weight:600;}
.chip.extra-chip b{color:var(--accent);font-weight:700;}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
}
</style>

/* ============ RENDER ============ */
const tabbar = document.getElementById('tabbar');
const panelsRoot = document.getElementById('panels');
const TABS = [{id:'todos', label:'Todos', icon:ICO.grid}].concat(
  CATEGORIES.map(c=>({id:c.id, label:c.label, icon:c.icon}))
);
/* "todos" shows every section at once (destacados first, as authored), so first-time
   visitors see the whole menu the way they'd scan a printed board; picking a category
   pill then narrows the page down to just that section. */
let mode = 'todos';
let lastFocused = null;
let spyObserver = null;

function priceLabel(item){
  if(item.price12_16) return null; // rendered as columns
  if(item.priceSD) return `S $${item.priceSD.s} / D $${item.priceSD.d}`;
  if(item.price) return `$${item.price}`;
  return '';
}

function extrasAppliesTo(key){
  return CATEGORIES.filter(c=>c.extras && c.extras.includes(key)).map(c=>c.label);
}

/* --- tabs --- */
TABS.forEach((tab)=>{
  const btn = document.createElement('button');
  btn.className='tab';
  btn.id='tab-'+tab.id;
  btn.setAttribute('role','tab');
  btn.setAttribute('aria-selected', tab.id===mode ? 'true':'false');
  btn.setAttribute('aria-controls', tab.id==='todos' ? 'panels' : 'panel-'+tab.id);
  btn.tabIndex = tab.id===mode ? 0 : -1;
  btn.innerHTML = tab.icon + '<span>'+tab.label+'</span>';
  btn.addEventListener('click', ()=>selectTab(tab.id));
  btn.addEventListener('keydown', (e)=>{
    const idx = TABS.findIndex(t=>t.id===tab.id);
    let next=null;
    if(e.key==='ArrowRight') next=TABS[(idx+1)%TABS.length];
    else if(e.key==='ArrowLeft') next=TABS[(idx-1+TABS.length)%TABS.length];
    else if(e.key==='Home') next=TABS[0];
    else if(e.key==='End') next=TABS[TABS.length-1];
    if(next){ e.preventDefault(); selectTab(next.id); document.getElementById('tab-'+next.id).focus(); }
  });
  tabbar.appendChild(btn);
});

/* --- panels --- */
CATEGORIES.forEach(cat=>{
  const panel = document.createElement('section');
  panel.className='panel active'; /* "todos" mode starts with every section visible */
  panel.id='panel-'+cat.id;
  panel.setAttribute('role','tabpanel');
  panel.setAttribute('aria-labelledby','tab-'+cat.id);

  const head = document.createElement('div');
  head.className='panel-head';
  head.innerHTML = cat.icon + `<h2>${cat.label}</h2>` + '<div class="panel-head-rule"></div>';
  panel.appendChild(head);

  if(cat.type==='featured'){
    const grid=document.createElement('div'); grid.className='featured-grid';
    cat.items.forEach(item=>{
      const card=document.createElement('button');
      card.className='f-card'; card.type='button';
      card.innerHTML = `
        <div class="f-thumb">${item.icon}</div>
        <div class="f-name">${item.name}</div>
        <div class="f-bottom">
          <span class="f-price">${priceLabel(item)}</span>
          <span class="f-hint">${ICO.chev}</span>
        </div>`;
      card.addEventListener('click', ()=>openModal(item, cat));
      grid.appendChild(card);
    });
    panel.appendChild(grid);
  }

  if(cat.type==='sizes'){
    const sh=document.createElement('div'); sh.className='size-head';
    sh.innerHTML = `<span class="sh-label"></span><span>${cat.sizeLabels[0]}</span><span>${cat.sizeLabels[1]}</span>`;
    panel.appendChild(sh);
    const list=document.createElement('div'); list.className='list';
    cat.items.forEach(item=>{
      const row=document.createElement('button');
      row.className='row'; row.type='button';
      row.innerHTML = `
        <div class="row-main">
          <div class="row-name">${item.name}</div>
          ${item.note?`<span class="row-note">${item.note}</span>`:''}
        </div>
        <div class="row-prices"><b>${item.price12_16.a}</b><b>${item.price12_16.b}</b></div>`;
      row.addEventListener('click', ()=>openModal(item, cat));
      list.appendChild(row);
    });
    panel.appendChild(list);
    if(cat.footnote){
      const fn=document.createElement('p'); fn.className='panel-footnote'; fn.textContent=cat.footnote;
      panel.appendChild(fn);
    }
  }

  if(cat.type==='list'){
    const list=document.createElement('div'); list.className='list';
    cat.items.forEach(item=>{
      const row=document.createElement('button');
      row.className='row'; row.type='button';
      row.innerHTML = `
        <div class="row-main">
          <div class="row-name">${item.name}</div>
          ${item.note?`<span class="row-note">${item.note}</span>`:''}
        </div>
        <span class="row-price-inline">${priceLabel(item)}</span>
        <span class="row-chevron">${ICO.chev}</span>`;
      row.addEventListener('click', ()=>openModal(item, cat));
      list.appendChild(row);
    });
    panel.appendChild(list);
  }

  if(cat.type==='extras'){
    const grid=document.createElement('div'); grid.className='extras-grid';
    Object.keys(EXTRAS).forEach(key=>{
      const ex=EXTRAS[key];
      const row=document.createElement('button');
      row.className='extra-row'; row.type='button';
      row.innerHTML = `<span>${ex.name}</span><b>$${ex.price}</b>`;
      row.addEventListener('click', ()=>openExtraModal(key));
      grid.appendChild(row);
    });
    panel.appendChild(grid);
  }

  panelsRoot.appendChild(panel);
});

setupScrollSpy();

function highlightTab(id){
  TABS.forEach(tab=>{
    const btn=document.getElementById('tab-'+tab.id);
    const isActive = tab.id===id;
    btn.setAttribute('aria-selected', isActive?'true':'false');
    btn.tabIndex = isActive?0:-1;
    if(isActive) btn.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
  });
}

function selectTab(id){
  mode = id;
  if(id==='todos'){
    CATEGORIES.forEach(cat=>{ document.getElementById('panel-'+cat.id).classList.add('active'); });
    window.scrollTo({top:0, behavior:'smooth'});
  } else {
    CATEGORIES.forEach(cat=>{
      document.getElementById('panel-'+cat.id).classList.toggle('active', cat.id===id);
    });
    document.getElementById('panel-'+id).scrollIntoView({block:'start', behavior:'smooth'});
  }
  highlightTab(id);
}

/* Scrollspy: while every section is visible ("todos"), the pill for whichever
   section is currently in view lights up, so the tab bar stays a live "you are
   here" reading of a long page instead of a static filter list. */
function setupScrollSpy(){
  if(spyObserver) spyObserver.disconnect();
  spyObserver = new IntersectionObserver((entries)=>{
    if(mode!=='todos' || window.scrollY < 32) return;
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        const id = entry.target.id.replace('panel-','');
        highlightTab(id);
      }
    });
  }, { rootMargin:'-45% 0px -50% 0px', threshold:0 });
  CATEGORIES.forEach(cat=> spyObserver.observe(document.getElementById('panel-'+cat.id)));
}
/* Right at the top of the page (before any section has scrolled into the spy band)
   "Todos" itself should read as the active pill, since that's what's actually on screen. */
window.addEventListener('scroll', ()=>{
  if(mode==='todos' && window.scrollY < 32) highlightTab('todos');
}, {passive:true});

/* ============ MODAL ============ */
const backdrop=document.getElementById('modalBackdrop');
const modalCard=document.getElementById('modalCard');
const modalClose=document.getElementById('modalClose');
const modalIcon=document.getElementById('modalIcon');
const modalName=document.getElementById('modalName');
const modalNote=document.getElementById('modalNote');
const modalPriceRow=document.getElementById('modalPriceRow');
const modalDesc=document.getElementById('modalDesc');
const modalDescWrap=document.getElementById('modalDescWrap');
const modalLleva=document.getElementById('modalLleva');
const modalLlevaWrap=document.getElementById('modalLlevaWrap');
const modalExtras=document.getElementById('modalExtras');
const modalExtrasWrap=document.getElementById('modalExtrasWrap');
const modalExtrasLabel=document.getElementById('modalExtrasLabel');

function openModal(item, cat){
  lastFocused = document.activeElement;
  modalIcon.className = item.icon ? 'modal-icon' : 'modal-icon small';
  modalIcon.innerHTML = item.icon ? item.icon : cat.icon;
  modalName.textContent = item.name;
  if(item.note){ modalNote.hidden=false; modalNote.textContent=item.note; } else { modalNote.hidden=true; }

  modalPriceRow.innerHTML='';
  if(item.price12_16){
    modalPriceRow.innerHTML = `<span class="modal-price-pill">${cat.sizeLabels[0]} $${item.price12_16.a}</span><span class="modal-price-pill">${cat.sizeLabels[1]} $${item.price12_16.b}</span>`;
  } else if(item.priceSD){
    modalPriceRow.innerHTML = `<span class="modal-price-pill">S $${item.priceSD.s}</span><span class="modal-price-pill">D $${item.priceSD.d}</span>`;
  } else {
    modalPriceRow.innerHTML = `<span class="modal-price-pill">$${item.price}</span>`;
  }

  modalDescWrap.hidden=false;
  modalDesc.textContent = item.desc||'';

  if(item.lleva && item.lleva.length){
    modalLlevaWrap.hidden=false;
    modalLleva.innerHTML = item.lleva.map(l=>`<span class="chip">${l}</span>`).join('');
  } else { modalLlevaWrap.hidden=true; }

  const extraKeys = item.extras || cat.extras || [];
  if(extraKeys.length){
    modalExtrasWrap.hidden=false;
    modalExtrasLabel.textContent='Extras disponibles';
    modalExtras.innerHTML = extraKeys.map(k=>`<span class="chip extra-chip">${EXTRAS[k].name} <b>+$${EXTRAS[k].price}</b></span>`).join('');
  } else { modalExtrasWrap.hidden=true; }

  showModal();
}

function openExtraModal(key){
  lastFocused = document.activeElement;
  const ex = EXTRAS[key];
  modalIcon.className='modal-icon small';
  modalIcon.innerHTML = ICO.plus;
  modalName.textContent = ex.name;
  modalNote.hidden=true;
  modalPriceRow.innerHTML = `<span class="modal-price-pill">$${ex.price}</span>`;
  modalDescWrap.hidden=false;
  modalDesc.textContent = ex.desc;
  modalLlevaWrap.hidden=true;
  const applies = extrasAppliesTo(key);
  if(applies.length){
    modalExtrasWrap.hidden=false;
    modalExtrasLabel.textContent='Disponible en';
    modalExtras.innerHTML = applies.map(l=>`<span class="chip">${l}</span>`).join('');
  } else { modalExtrasWrap.hidden=true; }
  showModal();
}

function showModal(){
  backdrop.classList.add('open');
  backdrop.hidden=false;
  document.body.style.overflow='hidden';
  modalClose.focus();
}
function closeModal(){
  backdrop.classList.remove('open');
  document.body.style.overflow='';
  setTimeout(()=>{ backdrop.hidden=true; }, 180);
  if(lastFocused) lastFocused.focus();
}

modalClose.addEventListener('click', closeModal);
backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) closeModal(); });
document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape' && backdrop.classList.contains('open')) closeModal();
  if(e.key==='Tab' && backdrop.classList.contains('open')){
    const focusables = modalCard.querySelectorAll('button, [href], [tabindex]:not([tabindex="-1"])');
    if(!focusables.length) return;
    const first=focusables[0], last=focusables[focusables.length-1];
    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
});

backdrop.hidden = true;
})();

</script>
