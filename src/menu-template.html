<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
__ANALYTICS__
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#F4E9CE"/>
<meta name="color-scheme" content="light"/>
<meta name="description" content="Menú de Starvochs Coffee: café caliente, espresso, bebidas frías, frappés y tés."/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Starvochs Coffee"/>
<link rel="icon" href="assets/logo.png"/>
<link rel="apple-touch-icon" href="assets/logo.png"/>
<title>Starvochs Coffee · Menú</title>
<link rel="stylesheet" href="assets/brand.css"/>
<link rel="stylesheet" href="assets/menu.css"/>
</head>
<body data-page="menu">

__NAVBAR__

<div class="page">
  <div class="tabbar-wrap">
    <div class="tabbar-mask">
      <div class="tabbar" role="tablist" id="tabbar" aria-label="Categorías del menú"></div>
    </div>
  </div>

  <main id="panels"></main>
</div>

<div class="wrap">
__FOOTER__
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalName" id="modalCard">
    <button class="modal-close" id="modalClose" aria-label="Cerrar">&times;</button>
    <button class="modal-share" id="modalShare" aria-label="Compartir esta bebida" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.3 10.7l7.4-4.4M8.3 13.3l7.4 4.4"/></svg>
    </button>
    <div id="modalIcon"></div>
    <h3 class="modal-name" id="modalName"></h3>
    <span class="modal-note" id="modalNote" hidden></span>
    <div class="modal-price-row" id="modalPriceRow"></div>
    <div class="modal-divider"></div>
    <div id="modalDescWrap">
      <p class="modal-label">Descripción</p>
      <p class="modal-desc" id="modalDesc"></p>
    </div>
    <div id="modalLlevaWrap">
      <p class="modal-label">Lleva</p>
      <div class="chip-row" id="modalLleva"></div>
    </div>
    <div id="modalExtrasWrap">
      <p class="modal-label" id="modalExtrasLabel">Extras disponibles</p>
      <div class="chip-row" id="modalExtras"></div>
    </div>
    <div class="modal-visit" id="modalVisit" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>
      <p>Disponible en todas nuestras sucursales. Por ahora no tomamos pedidos por WhatsApp ni apps: ¡te esperamos en la más cercana!</p>
    </div>
  </div>
</div>

<script src="assets/site.js" defer></script>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="assets/menu.js" defer></script>
</body>
</html>
