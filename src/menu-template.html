<meta charset="utf-8"/>
<title>Starvochs Coffee — Menú</title>
<style>
@font-face{font-family:'Fredoka';font-style:normal;font-weight:400 700;font-display:swap;
  src:url(data:font/woff2;base64,__FREDOKA_B64__) format('woff2');}
@font-face{font-family:'Caveat';font-style:normal;font-weight:400 700;font-display:swap;
  src:url(data:font/woff2;base64,__CAVEAT_B64__) format('woff2');}
@font-face{font-family:'Work Sans';font-style:normal;font-weight:300 800;font-display:swap;
  src:url(data:font/woff2;base64,__WORKSANS_B64__) format('woff2');}

/* Starvochs Coffee is a fixed cream-and-pine brand identity taken straight from the
   physical poster — this page commits to that single light palette on purpose,
   regardless of OS/device theme, so it always reads as "the menu on the wall". */
:root, :root[data-theme="dark"], :root[data-theme="light"]{
  --bg:#F4E9CE; --surface:#FBF3DF; --surface-2:#F1E3BE; --border:#DCC793;
  --ink:#2A2118; --ink-muted:#6B5B44; --heading:#173625; --heading-soft:#2C5A42;
  --accent:#C22A2E; --accent-deep:#8F1D22; --accent-contrast:#FBF3DF;
  --chip-bg:#EFE2BE; --shadow:rgba(23,54,37,0.16); --backdrop:rgba(15,28,20,0.6);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Work Sans',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(circle at 1px 1px, rgba(0,0,0,0.035) 1px, transparent 0);
  background-size:22px 22px;
}
button{font-family:inherit;}
.page{max-width:1000px;margin:0 auto;padding:28px 18px 60px;}

/* ---------- Masthead ---------- */
.masthead{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-bottom:22px;}
.badge{
  width:clamp(72px,16vw,110px);height:clamp(72px,16vw,110px);flex:0 0 auto;
  display:block;object-fit:contain;
}
.brand-title{
  font-family:'Fredoka',sans-serif;font-weight:700;letter-spacing:1.5px;
  font-size:clamp(28px,6vw,44px);color:var(--heading);text-transform:uppercase;
  text-wrap:balance;margin:2px 0 0;
}
.brand-tagline{
  font-family:'Caveat',cursive;font-weight:700;color:var(--accent);
  font-size:clamp(20px,3.4vw,26px);transform:rotate(-2deg);margin:-4px 0 0;
}
.masthead-rule{width:100%;height:2px;background:var(--border);border:0;margin:0 0 18px;}

/* ---------- Tabs ---------- */
.tabbar-wrap{
  position:sticky;top:0;z-index:20;background:var(--bg);
  padding:6px 0 12px;margin:0 -18px 20px;
}
.tabbar-mask{
  padding:0 18px;overflow-x:auto;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%);
}
.tabbar-mask::-webkit-scrollbar{display:none;}
.tabbar{display:flex;gap:8px;width:max-content;padding:2px 2px;}
.tab{
  display:flex;align-items:center;gap:7px;white-space:nowrap;
  padding:10px 16px;border-radius:999px;border:1.5px solid var(--border);
  background:var(--surface);color:var(--heading-soft);
  font-weight:600;font-size:14px;cursor:pointer;transition:transform .15s ease, background .15s ease, color .15s ease, border-color .15s ease;
}
.tab svg{width:16px;height:16px;flex:0 0 auto;}
.tab:hover{transform:translateY(-1px);border-color:var(--heading-soft);}
.tab[aria-selected="true"]{
  background:var(--heading);color:var(--accent-contrast);border-color:var(--heading);
}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ---------- Panel heading ---------- */
.panel{display:none;scroll-margin-top:86px;}
.panel.active{display:block;animation:fade .25s ease;}
.panel.active + .panel.active{margin-top:38px;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.panel-head{display:flex;align-items:center;gap:9px;margin-bottom:14px;}
.panel-head svg{width:19px;height:19px;color:var(--accent);flex:0 0 auto;}
.panel-head h2{
  font-family:'Fredoka',sans-serif;font-weight:600;letter-spacing:.5px;
  font-size:19px;color:var(--heading);text-transform:uppercase;margin:0;
}
.panel-head-rule{flex:1;height:2px;background:var(--border);}

/* ---------- Featured grid ---------- */
.featured-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;margin-bottom:8px;}
.f-card{
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:14px 14px 16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px;
  transition:transform .15s ease, box-shadow .15s ease;
}
.f-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px -12px var(--shadow);}
.f-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.f-thumb{
  border-radius:14px;aspect-ratio:1/0.82;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 32%, var(--surface-2), var(--chip-bg));
}
.f-thumb svg{width:64%;height:64%;}
.f-name{font-family:'Fredoka',sans-serif;font-weight:600;font-size:15.5px;color:var(--heading);text-wrap:balance;}
.f-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.f-price{font-weight:700;color:var(--accent);font-size:14.5px;font-variant-numeric:tabular-nums;line-height:1.25;}
.f-hint{flex:0 0 auto;color:var(--ink-muted);display:flex;}
.f-hint svg{width:14px;height:14px;display:block;}

/* ---------- List rows ---------- */
.size-head{display:flex;align-items:baseline;padding:0 4px 6px;gap:10px;}
.size-head .sh-label{flex:1;}
.size-head span{
  font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--ink-muted);
  text-transform:uppercase;width:52px;text-align:right;
}
.list{border-top:1px solid var(--border);}
.row{
  display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--border);
  cursor:pointer;background:transparent;border-left:none;border-right:none;border-top:none;
  width:100%;text-align:left;transition:background .15s ease;
}
.row:hover, .row:focus-visible{background:var(--surface-2);}
.row:focus-visible{outline:none;}
.row-main{flex:1;min-width:0;}
.row-name{font-weight:600;font-size:15px;color:var(--ink);}
.row-note{
  display:block;font-style:italic;font-size:12px;color:var(--ink-muted);
  margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.row-prices{display:flex;gap:0;flex:0 0 auto;}
.row-prices b{
  width:52px;text-align:right;color:var(--accent);font-weight:700;font-size:14.5px;
  font-variant-numeric:tabular-nums;
}
.row-price-inline{color:var(--accent);font-weight:700;font-size:14.5px;white-space:nowrap;font-variant-numeric:tabular-nums;}
.row-chevron{color:var(--ink-muted);flex:0 0 auto;}
.row-chevron svg{width:14px;height:14px;display:block;}
.panel-footnote{margin:12px 4px 0;font-style:italic;font-size:12.5px;color:var(--ink-muted);}

/* ---------- Extras tab ---------- */
.extras-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
.extra-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:13px 15px;cursor:pointer;transition:transform .15s ease,background .15s ease;text-align:left;
}
.extra-row:hover{background:var(--surface-2);transform:translateY(-1px);}
.extra-row span:first-child{font-weight:600;font-size:14.5px;}
.extra-row b{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums;}

/* ---------- Footer ---------- */
.footer{margin-top:36px;padding-top:20px;border-top:2px solid var(--border);text-align:center;display:flex;flex-direction:column;gap:6px;}
.footer .script{font-family:'Caveat',cursive;font-weight:700;color:var(--accent);font-size:20px;}
.footer .thanks{font-weight:700;color:var(--heading);font-size:14px;}
.social-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin-top:6px;}
.social-link{
  display:inline-flex;align-items:center;gap:7px;color:var(--ink-muted);
  font-size:13px;font-weight:500;text-decoration:none;padding:7px 13px;
  border-radius:999px;border:1px solid transparent;transition:color .15s ease,border-color .15s ease,background .15s ease;
}
.social-link svg{width:15px;height:15px;flex:0 0 auto;}
.social-link:hover{color:var(--accent);background:var(--surface);border-color:var(--border);}
.social-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:var(--backdrop);display:flex;align-items:flex-end;justify-content:center;
  padding:0;z-index:100;opacity:0;pointer-events:none;transition:opacity .18s ease;
}
.modal-backdrop.open{opacity:1;pointer-events:auto;}
@media (min-width:640px){.modal-backdrop{align-items:center;padding:20px;}}
.modal{
  background:var(--surface);width:100%;max-width:440px;max-height:88vh;overflow-y:auto;
  border-radius:24px 24px 0 0;padding:26px 22px 28px;position:relative;
  box-shadow:0 -12px 40px -12px var(--shadow);
  transform:translateY(14px);transition:transform .2s ease;
}
@media (min-width:640px){.modal{border-radius:24px;transform:translateY(6px) scale(.98);}}
.modal-backdrop.open .modal{transform:translateY(0) scale(1);}
.modal-close{
  position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--border);background:var(--surface-2);color:var(--ink);
  font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.modal-close:hover{background:var(--chip-bg);}
.modal-icon{
  width:96px;height:96px;border-radius:50%;margin:0 auto 14px;
  background:radial-gradient(circle at 50% 32%, var(--surface-2), var(--chip-bg));
  display:flex;align-items:center;justify-content:center;
}
.modal-icon svg{width:62%;height:62%;}
.modal-icon.small svg{width:46%;height:46%;color:var(--accent);}
.modal-name{font-family:'Fredoka',sans-serif;font-weight:600;font-size:22px;color:var(--heading);text-align:center;text-wrap:balance;}
.modal-note{display:block;text-align:center;font-style:italic;font-size:13px;color:var(--ink-muted);margin-top:4px;}
.modal-price-row{display:flex;justify-content:center;gap:10px;margin-top:10px;}
.modal-price-pill{
  background:var(--chip-bg);color:var(--accent);font-weight:700;padding:5px 14px;border-radius:999px;
  font-size:14px;font-variant-numeric:tabular-nums;
}
.modal-divider{height:1px;background:var(--border);margin:18px 0;}
.modal-label{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-muted);margin-bottom:7px;}
.modal-desc{font-size:14.5px;line-height:1.55;color:var(--ink);margin:0 0 16px;}
.chip-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px;}
.chip{
  border:1px solid var(--border);background:var(--chip-bg);color:var(--ink);
  font-size:12.5px;font-weight:500;padding:6px 11px;border-radius:999px;
}
.chip.extra-chip{color:var(--heading-soft);font-weight:600;}
.chip.extra-chip b{color:var(--accent);font-weight:700;}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
}
</style>
